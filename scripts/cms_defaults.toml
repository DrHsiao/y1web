body = """
## 開始之前

- 先確認您的助聽器有**藍牙功能**（不確定可以問門市）。
- 各品牌有自己的官方 App，請在 App Store 或 Google Play 搜尋品牌名稱，下載**官方**的 App。

## 配對的一般方式

