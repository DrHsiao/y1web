[[care]]
slug = "dome-filter"
title = "更換耳塞與耳垢濾網"
sort = 40
types = ["ric"]
summary = "聲音變小、悶悶的，常常是濾網被耳垢塞住了。"
body = """
## 什麼時候要換

- **耳塞**：變硬、變黃、破損，或戴起來不貼合時。依使用情況，大約一到三個月換一次。
- **耳垢濾網**：聲音突然變小、變悶，或沒有聲音，先檢查濾網是不是塞住了。

## 換濾網的一般步驟

1. 先取下耳塞。
2. 用換濾網工具「空的那一端」插進舊濾網，直直拔出來。
3. 把工具轉過來，用「有新濾網的那一端」對準出聲孔，直直壓進去，再把工具拿開。
4. 裝回耳塞，**確認有卡緊**，避免耳塞留在耳道裡。

各品牌的濾網型號不同，不能混用。請使用門市給您的型號；不確定怎麼換，帶來門市我們示範給您看。

耳塞不小心留在耳道裡，請不要自己用夾子夾，請到耳鼻喉科處理。
"""

[[care]]
slug = "custom-clean"
title = "耳內型助聽器的清潔"
sort = 50
types = ["custom"]
summary = "出聲孔朝下輕刷，耳垢才不會被推進去。"
body = """
## 每天

1. 用乾的軟布擦拭外殼。
2. 出聲孔（朝向耳道的那一端）**朝下**，用小刷子輕刷，把耳垢刷掉。
3. 如果有通氣孔，可以用門市給的清潔工具輕輕通一下。

## 注意

- 不要用牙籤、髮夾等尖銳的東西戳出聲孔或麥克風孔。
- 有耳垢濾網的機型，聲音變小時先檢查濾網，換法可以參考「更換耳塞與耳垢濾網」。
- 外殼有裂痕、戴起來會痛或容易掉，請回門市檢查。
"""

[[care]]
slug = "dry-store"
title = "除濕與收納"
sort = 60
types = []
summary = "台灣潮濕、容易流汗，濕氣是助聽器常見的故障原因之一。"
body = """
## 平常的除濕

- 晚上取下後放進**乾燥盒**。乾燥劑變色或用了一段時間，請依說明更換。
- 電子除濕盒的用法（要不要取出電池、要放多久）請照它的說明書。
- 充電式通常放回充電座就好；常流汗、常在戶外的人，可以問門市適合的除濕方式。

## 不小心弄濕了

1. 立刻取下，用乾布擦乾外面。
2. 電池式：取出電池，打開電池門。
3. **不要用吹風機、烤箱或微波爐烘乾**。
4. 放進乾燥盒，盡快帶回門市檢查。

## 外出收納

用盒子裝好再放進包包，不要用衛生紙包著（很容易被當成垃圾丟掉），也不要放在寵物咬得到的地方。
"""

[[care]]
slug = "troubleshoot"
title = "沒聲音、聲音變小、嗶嗶叫：先自己檢查"
sort = 70
types = []
summary = "很多狀況換個電池、清一下濾網就好了；還是不行再帶回門市。"
body = """
## 沒有聲音

- 電池式：換一顆新電池（記得撕貼紙）；充電式：確認已經充飽。
- 確認有開機、音量沒有被調到最小。
- 檢查耳塞、出聲孔、耳垢濾網有沒有被耳垢塞住。

## 聲音變小、變悶

- 先清潔或更換耳垢濾網、耳塞。
- 耳道裡的耳垢比較多時也會這樣，請到耳鼻喉科清耳垢，不要自己挖。

## 一直嗶嗶叫

- 取下來重新戴好，確認有塞到位。
- 耳塞尺寸不合、耳垢多都可能造成，請回門市檢查。
- 講電話時手機太貼近助聽器也會叫，稍微拿開一點。

## 聲音時有時無、有雜音

- 可能受潮或電池接觸不良：先換電池、放進乾燥盒除濕。

以上都試過還是不行，請**帶回門市檢查**，不要自己拆開。突然聽不到、耳朵痛或流分泌物，請先到耳鼻喉科就醫。
"""

