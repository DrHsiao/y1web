summary = "每天花一分鐘擦乾淨、收進乾燥盒，助聽器比較不容易出狀況。"
body = """
## 每天取下後

1. 用**乾的軟布**（或門市給的清潔布）擦拭機身和耳塞。**不要用水、酒精或清潔劑**。
2. 用附的小刷子輕刷麥克風孔和出聲孔。刷的時候讓孔**朝下**，耳垢才會往下掉，不會刷進去。
3. 電池式：打開電池門，放進乾燥盒；充電式：放回充電座。

## 平常要避免

- 洗澡、游泳、洗頭時先取下。
- 不要放在浴室、廚房、車內等潮濕或高溫的地方。
- 不要用吹風機或微波爐烘乾。
- 髮膠、防曬乳、乳液先擦好、手洗乾淨，再戴助聽器。

## 定期回門市

清潔、除濕、更換耳塞與濾網、檢查聲音與設定，都可以預約門市處理。覺得聲音和以前不一樣，也歡迎回來調整。
"""

