slug = "subsidy-basics"
category = "補助申請"
title = "助聽器補助怎麼申請？先了解這幾件事"
date = "2026-10-15"
summary = "符合資格的民眾可以申請輔具費用補助，資格與金額依身分、縣市規定而定。"
body = """
政府對符合資格的民眾提供助聽器等輔具的費用補助。各縣市的申請流程與補助額度可能不同，也會隨法規調整，以下是一般常見的情況，實際規定請以戶籍所在地的公告為準。

## 申請前可以先確認

- **是否有身心障礙證明**：輔具費用補助通常以持有身心障礙證明（聽覺相關）為申請條件。
- **家庭經濟狀況**：低收入戶、中低收入戶與一般戶的補助比例通常不同。
- **是否需要先評估**：部分品項要先經輔具評估，取得評估報告。
- **購買前或購買後申請**：各地規定不同，建議**購買前先詢問**，避免因順序不符而無法補助。

## 去哪裡問？

- 戶籍所在地的區公所、社會局（處）。
- 各縣市的輔具資源中心。

我們可以協助您了解申請時需要準備的文件，歡迎來電或到門市詢問。
"""

[[article]]
slug = "daily-care"
category = "生活樂活"
title = "助聽器的日常保養：防潮、清潔與電池"
date = "2026-10-18"
summary = "耳垢和濕氣是助聽器最常見的故障原因，養成幾個小習慣就能少很多麻煩。"
body = """
助聽器每天戴在耳朵上，會接觸到汗水、耳垢和濕氣。日常保養做得好，可以減少故障、讓聲音保持清楚。

## 每天

- 取下後用**乾的軟布**擦拭機身，不要用水或酒精。
- 檢查出聲孔、耳塞有沒有耳垢，用隨附的小刷子輕輕清掉。
- 晚上放進**乾燥盒**；充電式的放回充電座。

## 每週

- 檢查耳塞是否變硬、變黃或破損，必要時更換。
- 電池式的，打開電池門讓機身透氣。

## 要避免

- 戴著洗澡、游泳、洗頭或吹頭髮。
- 放在浴室、車內等潮濕或高溫的地方。
- 噴髮膠、防曬乳時戴著助聽器。

## 電池小提醒

- 電池撕下貼紙後，等約 1 分鐘再裝入，電力比較穩定。
- 隨身帶備用電池；用完的電池請回收。

建議定期回門市做清潔、除濕與檢查。如果出現沒聲音、斷斷續續或有雜音，先換電池或確認已充飽，仍無改善請帶到門市檢查。
"""

