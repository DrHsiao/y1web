# ── 聽力專欄（自己撰寫的衛教文章）──────────────────────────
[[article]]
slug = "first-hearing-aid"
category = "助聽器知識"
title = "第一次戴助聽器，適應期要多久？"
date = "2026-10-01"
summary = "剛戴上覺得吵、自己的聲音怪怪的，都是常見的情況。給自己和大腦一點時間。"
body = """
很多人第一次戴助聽器，會覺得周圍突然變得很吵：冰箱聲、腳步聲、翻報紙的聲音都跑出來了，自己說話的聲音聽起來也不太一樣。這些都是常見的情況。

## 為什麼會這樣？

聽力慢慢變差的過程中，大腦已經很久沒有聽到某些聲音。戴上助聽器後，這些聲音重新出現，大腦需要時間重新學習「哪些聲音重要、哪些可以忽略」。

## 適應的小建議

1. **從安靜的地方開始**：先在家裡戴，和家人聊天、看電視，再慢慢到人多的地方。
2. **每天固定時間戴**：一開始每天幾個小時，再逐漸拉長。偶爾戴一下反而不容易適應。
3. **記下不舒服的狀況**：例如「餐廳裡聽不清楚」「炒菜聲太刺耳」，回門市時告訴我們，可以依情況調整。
4. **家人一起幫忙**：說話放慢、面對面講，比提高音量更有幫助。

適應時間因人而異，一般需要幾週，有些人更久。過程中有任何不舒服，都歡迎回門市調整。
"""

[[article]]
slug = "choose-hearing-aid-style"
category = "助聽器知識"
title = "耳掛型、耳內型，怎麼選？"
date = "2026-10-05"
summary = "外型不同，適合的聽力狀況、操作方式也不同。先了解差別，再和選配人員討論。"
body = """
助聽器常見的外型有幾種，各有適合的情況：

| 外型 | 特點 | 可能要考慮的地方 |
|---|---|---|
| 耳掛型（受話器外置 RIC） | 機身掛在耳後，喇叭放在耳道內，外觀小巧 | 細導線與耳塞要定期更換 |
| 耳掛型（BTE） | 機身較大，按鍵好操作，適用的聽力範圍廣 | 外觀比較明顯 |
| 耳內型、耳道型（ITE／ITC） | 依耳型訂做，放在耳朵裡 | 要先取耳模，耳垢多要常清潔 |
| 深耳道型（CIC） | 放在耳道深處，外觀較不明顯 | 體積小，電池與按鍵較小，手指不靈活的長輩要評估 |

## 選擇時可以想想

- **聽力狀況**：不同程度的聽力損失，適合的外型與功率不同。
- **手指靈活度、視力**：電池大小、按鍵位置會影響日常操作。
- **生活需求**：常講電話、看電視，或需要藍牙連手機，都可以一起考慮。
- **充電式或電池式**：充電式不用換電池；電池式出門時比較不用擔心沒電。

哪一款適合您，要看實際的聽力狀況和需求。歡迎預約到門市，親自比較不同外型的差別。驗配所需之測試，依相關法令辦理。
"""

[[article]]
slug = "signs-of-hearing-loss"
category = "聽力保健"
title = "聽力變差的警訊：家人可以留意的 6 件事"
date = "2026-10-08"
summary = "聽力通常是慢慢變差的，本人不一定察覺，家人的觀察很重要。"
body = """
聽力多半是慢慢退化的，很多人不覺得自己聽不清楚，反而是家人先發現。如果家中長輩有以下情況，可以多留意：

1. 電視、收音機的音量越開越大。
2. 常說「什麼？」「再說一次」，或答非所問。
3. 在餐廳、聚會等吵雜的地方，特別難聽懂別人說話。
4. 講電話時常聽不清楚，或改用另一隻耳朵聽。
5. 聽不到門鈴、電話鈴聲或電鍋的提示音。
6. 變得不想參加聚會、比較少說話。

## 可以怎麼做？

- 先用輕鬆的方式聊聊，不要責怪，避免長輩覺得被嫌棄。
- 可以先試試本站的「聽力不求人」線上自我察覺，了解大概的狀況（結果僅供參考）。
- 預約專業的聽力檢查，了解實際情況。驗配所需之測試，依相關法令辦理。

如果是**突然聽不到、單耳聽力變差，或伴隨耳鳴、暈眩**，請盡快到耳鼻喉科就醫。
"""

[[article]]
slug = "auditory-training"
category = "聽能復健"
title = "戴了助聽器還是聽不清楚？談聽能復健"
date = "2026-10-12"
summary = "助聽器幫您把聲音送進耳朵，聽懂話還需要大腦的配合與練習。"
body = """
有些人戴了助聽器之後，聲音是聽得到了，卻還是覺得「聽到但聽不懂」。這時候除了檢查助聽器的設定，也可以從日常練習著手。

## 日常可以做的練習

- **聽有字幕的節目**：一邊看字幕、一邊聽，幫助大腦把聲音和字連結起來。
- **聽有聲書、廣播**：從熟悉的內容開始，慢慢換成不熟悉的題材。
- **和家人練習對話**：先在安靜的房間，再到有背景聲音的地方。
- **多參加社交活動**：多聽、多說，是最自然的練習。

## 家人可以幫忙

- 說話前先叫名字、確定對方在看著您。
- 說慢一點、清楚一點，不需要大吼。
- 一句話沒聽懂，換個說法再說一次。

如果持續覺得聽不清楚，請回門市讓我們檢查助聽器的狀況並調整設定。
"""

[[article]]
slug = "subsidy-basics"
category = "補助申請"
title = "助聽器補助怎麼申請？先了解這幾件事"
date = "2026-10-15"
summary = "符合資格的民眾可以申請輔具費用補助，資格與金額依身分、縣市規定而定。"
body = """
政府對符合資格的民眾提供助聽器等輔具的費用補助。各縣市的申請流程與補助額度可能不同，也會隨法規調整，以下是一般常見的情況，實際規定請以戶籍所在地的公告為準。

## 申請前可以先確認

- **是否有身心障礙證明**：輔具費用補助通常以持有身心障礙證明（聽覺相關）為申請條件。
- **家庭經濟狀況**：低收入戶、中低收入戶與一般戶的補助比例通常不同。
- **是否需要先評估**：部分品項要先經輔具評估，取得評估報告。
- **購買前或購買後申請**：各地規定不同，建議**購買前先詢問**，避免因順序不符而無法補助。

## 去哪裡問？

- 戶籍所在地的區公所、社會局（處）。
- 各縣市的輔具資源中心。

我們可以協助您了解申請時需要準備的文件，歡迎來電或到門市詢問。
"""

[[article]]
slug = "daily-care"
category = "生活樂活"
title = "助聽器的日常保養：防潮、清潔與電池"
date = "2026-10-18"
summary = "耳垢和濕氣是助聽器最常見的故障原因，養成幾個小習慣就能少很多麻煩。"
body = """
助聽器每天戴在耳朵上，會接觸到汗水、耳垢和濕氣。日常保養做得好，可以減少故障、讓聲音保持清楚。

## 每天

- 取下後用**乾的軟布**擦拭機身，不要用水或酒精。
- 檢查出聲孔、耳塞有沒有耳垢，用隨附的小刷子輕輕清掉。
- 晚上放進**乾燥盒**；充電式的放回充電座。

## 每週

- 檢查耳塞是否變硬、變黃或破損，必要時更換。
- 電池式的，打開電池門讓機身透氣。

## 要避免

- 戴著洗澡、游泳、洗頭或吹頭髮。
- 放在浴室、車內等潮濕或高溫的地方。
- 噴髮膠、防曬乳時戴著助聽器。

## 電池小提醒

- 電池撕下貼紙後，等約 1 分鐘再裝入，電力比較穩定。
- 隨身帶備用電池；用完的電池請回收。

建議定期回門市做清潔、除濕與檢查。如果出現沒聲音、斷斷續續或有雜音，先換電池或確認已充飽，仍無改善請帶到門市檢查。
"""

