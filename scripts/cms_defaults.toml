body = """
## 認識電池號碼

助聽器電池依大小分號碼，包裝和貼紙的顏色是統一的：

| 號碼 | 顏色 |
|---|---|
| 10 號 | 黃色 |
| 312 號 | 咖啡色 |
| 13 號 | 橘色 |
| 675 號 | 藍色 |

請用門市告訴您的號碼，不同號碼不能混用。

## 換電池的步驟

1. 打開電池門，取出舊電池。
2. 撕掉新電池的貼紙，**放著等一下**（約 1 分鐘）再裝，電池接觸空氣後電力比較穩定。
3. 「+」那一面對準電池門上的「+」記號放進去。
4. 輕輕關上電池門。**關不起來不要硬壓**，通常是方向放反了。

## 小提醒

- 電快用完時，多數助聽器會發出提示聲，建議隨身帶備用電池。
- 晚上不戴時打開電池門，可以省電，也讓濕氣散出去。
- 電池請放在**小孩和寵物拿不到**的地方。誤吞電池請立刻就醫。
- 用完的電池請丟到電池回收筒。
"""

