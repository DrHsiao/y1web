slug = "phonak-audeo-sphere"
brand = "Phonak"
title = "Phonak Audéo Sphere Infinio"
match = ["Audéo Sphere"]
summary = "Phonak 2024 年推出的系列，除了主處理晶片，另外內建一顆專門處理吵雜環境語音的 AI 晶片（DEEPSONIC）。"
sources = [{ title = "Sonova 原廠新聞稿（英文）", url = "https://www.sonova.com/en/media/phonak-elevates-sound-quality-new-infinio-portfolio-introducing-paradigm-shift-real-time-ai" }]
body = """
## 特色
- 雙晶片：ERA 主處理晶片＋DEEPSONIC AI 晶片，依原廠說明，用來即時分離語音與背景噪音
