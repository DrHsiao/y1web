[[series]]
slug = "resound-enzo-ia"
brand = "ReSound"
title = "ReSound Enzo IA"
match = ["Enzo IA"]
summary = "ReSound 的超強功率耳掛型，原廠定位給重度到極重度聽損使用，是充電式。"
