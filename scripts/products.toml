# 產品系列介紹（官網「產品介紹」頁）。seed_content.py 匯入 y1web.web_posts（kind=product）。
#
# 撰寫原則（2026-10-21）：
#   - 不寫價格。外型、電源、等級數由程式從 y1crm 商品型錄（v_catalog）自動算出，這裡不重複。
#   - 只寫原廠公開資料裡的功能；「最小」「第一」「改善 X dB」這類宣稱不寫，避免醫療器材廣告疑慮。
#   - 「適合考慮的人」只是方向，實際是否適合要經過評估。
#   - match＝型錄 model_name 的開頭（後面接空白或 -），同品牌才比對。
#   - 正式上線前請門市或聽力師審過。

[[series]]
slug = "resound-vivia"
brand = "ReSound"
title = "ReSound Vivia"
match = ["Vivia"]
summary = "ReSound 2025 年推出的高階系列，內建 AI 晶片處理吵雜環境中的語音，支援 Bluetooth LE Audio 與 Auracast 廣播音訊。"
sources = [{ title = "ReSound 原廠介紹（英文）", url = "https://www.resound.com/en/hearing-aids/resound-hearing-aids/resound-vivia" }]
body = """
## 特色
- 內建深度神經網路（DNN）晶片，依原廠說明，能在吵雜環境中降低噪音、突顯想聽的聲音
- 支援 Bluetooth LE Audio 與 Auracast 廣播音訊；可用 ReSound Smart 3D App 搜尋並連接廣播
- 相容的 iPhone、iPad 與 Android 手機可以輕點助聽器免持接聽電話
- 有充電式與電池式，外殼有防水防塵奈米塗層

## 適合考慮的人
- 常在餐廳、聚會等吵雜場合聊天的人
- 想用手機直接聽電話、聽音樂的人
"""

[[series]]
slug = "resound-nexia"
brand = "ReSound"
title = "ReSound Nexia"
match = ["Nexia"]
summary = "ReSound 的高階系列，支援 Bluetooth LE Audio 與 Auracast，有耳掛與客製耳內等多種外型。"
sources = [{ title = "ReSound 原廠介紹（英文）", url = "https://www.resound.com/en/hearing-aids/resound-hearing-aids/resound-nexia" }]
body = """
## 特色
- 支援 Bluetooth LE Audio 與 Auracast 廣播音訊，配件 TV-Streamer+、Multi-Mic+ 也支援 Auracast
- ReSound Smart 3D App 可以確認助聽器有沒有戴好、微調聲音，並切換吵雜環境用的程式
- 外型選擇多：受話器外置（RIE）、耳掛型、客製耳內型

## 適合考慮的人
- 想要高階功能、又需要不同外型選擇的人
"""

[[series]]
slug = "resound-omnia"
brand = "ReSound"
title = "ReSound Omnia"
match = ["Omnia"]
summary = "ReSound 前一代的高階系列，主打在吵雜環境中聽清楚前方說話的人，同時保留周圍的聲音。"
sources = [{ title = "GN 原廠介紹（英文）", url = "https://www.gnhearing.com/en/products/hearing-aids/omnia/benefits" }]
body = """
## 特色
- Front Focus 方向性：在吵雜環境中加強前方的說話聲
- 360 All-Around：同時保留來自四周的聲音
- App 可以拍照確認助聽器是否戴對位置（Check My Fit）
- 有充電式機型，提供多種充電座選擇

## 小提醒
- Omnia 之後已有 Nexia、Vivia 等新系列，可以一起比較
"""

